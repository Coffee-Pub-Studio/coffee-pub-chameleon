name: Core checks

# A short lane of quick core checks that have caught real breakage and need no browser, no LiveKit and no running server.
# About a minute in all. Each check is its own step, so a failure names itself; every step runs even when an earlier one fails.
# The full suite (`npm run check`) is not run here; it runs at release prep.

on:
  pull_request:
    paths:
      - 'public/**'
      - 'server/**'
      - 'modules/**'
      - 'tools/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/core-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-checks:
    name: Core checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Syntax
        run: node tools/check-syntax.mjs
      - name: Generated design system sources
        if: success() || failure()
        run: node tools/check-sources-modules.mjs
      - name: System CSS
        if: success() || failure()
        run: node tools/check-system-css.mjs
      - name: Modules
        if: success() || failure()
        run: node tools/check-modules.mjs
      - name: Catalog
        if: success() || failure()
        run: node tools/check-catalog.mjs
      - name: Module versions
        if: success() || failure()
        run: node tools/check-module-versions.mjs
      - name: Clear and undo
        if: success() || failure()
        run: node tools/check-clear-undo.mjs
      - name: Destinations
        if: success() || failure()
        run: node tools/check-destinations.mjs
      - name: Space erase
        if: success() || failure()
        run: node tools/check-space-erase.mjs
